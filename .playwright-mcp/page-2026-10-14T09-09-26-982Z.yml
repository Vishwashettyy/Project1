        - paragraph [ref=f2e171]: The Delhi Police has cited alleged obstruction of police personnel in the discharge of their official duties, repeated violations of the law and attempts to incite others through social media as reasons for its action against three members of the Cockroach Janta Party (CJP), following their alleged entry into the denotified protest site at Jantar Mantar.
        - paragraph [ref=f2e172]: CJP leaders Sourav Das and Ashutosh Ranka have been remanded to five days of judicial custody and lodged in separate jails within the Tihar complex. Das has been lodged in Jail Number 2, while Ranka has been lodged in Jail Number 4.
