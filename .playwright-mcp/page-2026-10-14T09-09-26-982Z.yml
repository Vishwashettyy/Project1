                - /url: /india/cjp-protest-people-arriving-from-other-states-detained-in-delhi-ws-kl-10375544.html
                - figure [ref=f2e195]:
                  - img "Security personnel keep vigil as heavy police deployment and entry restrictions are enforced at Jantar Mantar. (PTI)" [ref=f2e196]
        - paragraph [ref=f2e197]: The action followed an incident on October 13, when 14 CJP members, including Das, Ranka and Ajinkya Shinde, allegedly entered Jantar Mantar through private premises despite the site having been removed from the list of designated protest venues.
        - paragraph [ref=f2e198]: In a statement, the Delhi Police said its personnel deployed at the location intervened and attempted to stop the protesters. However, the protesters allegedly obstructed police personnel in the discharge of their official duties, prompting the police to take legal action against all 14 individuals.
        - heading [level=3] [ref=f2e200]:
          - strong [ref=f2e201]: Delhi Police Cites Repeated Violations, Social Media Activity
        - paragraph [ref=f2e202]: Explaining its action against Das, Ranka and Shinde, the Delhi Police said the three were taken into preventive custody in view of their alleged repeated attempts to disturb public peace and violate the law.
        - paragraph [ref=f2e203]: The police also took into consideration their alleged attempts to instigate others through social media to engage in similar unlawful activities, according to the statement.
        - generic [ref=f2e205]:
          - generic [ref=f2e206]: At A Glance
          - generic [ref=f2e207]:
            - listitem [ref=f2e208]:
              - generic [ref=f2e209]: "1."
              - paragraph [ref=f2e210]: Delhi Police cited alleged obstruction of police personnel, repeated legal violations and social media incitement in its action against three CJP members.
            - listitem [ref=f2e211]:
              - generic [ref=f2e212]: "2."
              - paragraph [ref=f2e213]: Sourav Das and Ashutosh Ranka have been remanded to five days of judicial custody.
            - listitem [ref=f2e214]:
              - generic [ref=f2e215]: "3."
              - paragraph [ref=f2e216]: They were later lodged in Tihar Jail Number 2 and Jail Number 4, respectively.
        - paragraph [ref=f2e217]: The three were produced before the Special Executive Magistrate (SEM), where proceedings were initiated under Sections 126 and 170 of the Bharatiya Nagarik Suraksha Sanhita (BNSS).
        - paragraph [ref=f2e218]: The police said the magistrate considered the details in the police report and the apprehension that the two leaders could repeat the alleged violations and encourage others to violate the law if released on bail.
        - paragraph [ref=f2e219]: Das and Ranka were subsequently remanded to five days of judicial custody.
        - paragraph [ref=f2e220]: Shinde, meanwhile, was bound down to maintain peace and good behaviour for six months on a personal bond and surety of Rs 5,000.
        - heading [level=3] [ref=f2e222]:
          - strong [ref=f2e223]: Two FIRs Registered After Jantar Mantar Incident
        - paragraph [ref=f2e224]: According to the Delhi Police statement, all 14 CJP members were detained following the October 13 incident. Two FIRs were registered in connection with the episode.
        - paragraph [ref=f2e225]: FIR No. 289/26 was registered at Connaught Place police station under Sections 223(a), 332 and 61(2). FIR No. 128/26 was registered at Parliament Street police station under Sections 221, 115(2), 132, 121(1) and 3(5). Both FIRs were registered on October 13.
        - paragraph [ref=f2e226]: The police said the protesters had reached Jantar Mantar by trespassing through private premises after the location was denotified as a designated protest site.
        - paragraph [ref=f2e227]: The action against the group followed the alleged obstruction of police personnel who attempted to prevent their entry.
        - paragraph [ref=f2e228]: The incident also comes against the backdrop of an earlier protest involving CJP members.
        - paragraph [ref=f2e229]: According to news agency PTI, Das and Ranka had signed bonds to maintain peace for a year after being detained during a protest on Saturday. They were detained again on Tuesday after allegedly breaching barricades and entering the Jantar Mantar area without authorisation.
        - heading [level=3] [ref=f2e231]:
          - strong [ref=f2e232]: Jantar Mantar Denotified As Protest Site
        - paragraph [ref=f2e233]: Jantar Mantar was removed from the list of designated protest venues following a Delhi Police order issued on October 11 by Police Commissioner Anurag Kumar.
        - paragraph [ref=f2e234]: The order designated Ramlila Maidan, Burari Ground and CBD Ground as venues for protests and demonstrations.
        - paragraph [ref=f2e235]: The CJP has criticised the decision, arguing that shifting demonstrations away from the political centre of the national capital would weaken the visibility of public dissent.
        - paragraph [ref=f2e236]: The October 13 protest reportedly involved slogans demanding the resignation of Chief Election Commissioner Gyanesh Kumar.
        - paragraph [ref=f2e237]: The demonstrations came amid protests by the CJP and other organisations over alleged irregularities in the Special Intensive Revision (SIR) of electoral rolls.
        - paragraph [ref=f2e238]: Reacting to the judicial custody of Das and Ranka, CJP founder Abhijeet Dipke criticised the action in a post on X, claiming that the leaders had been sent to custody for unfurling the Tricolour at Jantar Mantar. He accused the government of attempting to crush dissent.
